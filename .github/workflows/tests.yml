name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Node 24 only, deliberately. package-lock.json is written by npm 11,
        # and npm 10 (which ships with node 20 and 22) rejects it outright:
        # `npm ci` reports "Missing: esbuild@... from lock file" for entries
        # that are demonstrably present. This ships to a browser, so no node
        # version is a runtime target — only the toolchain — and matching CI to
        # the npm that writes the lock keeps `npm ci` authoritative rather than
        # downgrading to `npm install` and silently re-resolving on every run.
        node-version: ['24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        # The combat rules are typed, and a type-only import resolves at
        # runtime even when the module does not exist — vitest erases it and
        # passes. tsc is what actually catches that, so it runs in CI too.
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
